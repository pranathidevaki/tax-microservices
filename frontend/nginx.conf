# Nginx does two jobs here:
#  1. serves the static frontend (index.html)
#  2. acts as a reverse proxy / mini API gateway: the browser only talks to ONE address,
#     and nginx forwards /api/tax/* and /api/gst/* to the right microservice.
# The hostnames "income-tax-service" and "gst-service" are resolved by
# Docker Compose's DNS (locally) or Kubernetes Service DNS (in the cluster).

server {
    listen 80;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    location /api/tax/ {
        proxy_pass http://income-tax-service:5000/;   # trailing / strips the /api/tax prefix
        proxy_set_header Host $host;
    }

    location /api/gst/ {
        proxy_pass http://gst-service:3000/;
        proxy_set_header Host $host;
    }

    location = /health {
        access_log off;
        return 200 'UP';
    }
}
