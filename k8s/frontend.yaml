apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: tax-frontend:latest   # the Jenkins pipeline switches this to :<build-number>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /health, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
# NodePort = expose the app OUTSIDE the cluster on a fixed port (30000-32767) of the node.
#   kubectl get svc frontend   ->  PORT(S) shows 80:30090/TCP
#   Open http://localhost:30090
#   If that doesn't load: kubectl port-forward service/frontend 18082:80 --address 127.0.0.1
#                         then open http://127.0.0.1:18082
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend            # must match the pod labels in the Deployment above
  ports:
    - port: 80               # the Service's own port inside the cluster
      targetPort: 80         # the container's port (nginx)
      nodePort: 30090        # the port opened on the node, for your browser
