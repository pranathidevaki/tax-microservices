apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: tax-frontend:latest   # the Jenkins pipeline switches this to :<build-number>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /health, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
# LoadBalancer = expose to the OUTSIDE world.
#   On Docker Desktop -> available at http://localhost
#   On a cloud cluster (AWS/GCP/Azure) -> the cloud creates a real load balancer with a public URL
#   Anywhere    -> kubectl port-forward svc/frontend 8080:80  then http://localhost:8080
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
